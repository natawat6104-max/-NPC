<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Star Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=Trirong:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar · left nav of content types · main workspace (list | editor | live preview), stacking to one column on phones. Single dark "observatory" look matching the game. */
:root {
  --bg: #0b1024;
  --surface: #121a36;
  --surface-2: #18224a;
  --line: #27335f;
  --text: #e6e9f5;
  --muted: #929dc4;
  --gold: #e3bf63;
  --gold-ink: #1b1405;
  --ok: #6fcfb0;
  --warn: #e8b04a;
  --bad: #ee7d5c;
  --blue: #7fa6ff;
  --font-display: "Trirong", "Sarabun", Georgia, serif;
  --font-ui: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 1.2rem; color: var(--gold); letter-spacing: 0.01em; }
.brand span { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .spacer { flex: 1; }
.saved { color: var(--muted); font-size: 0.8rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; }
.pill.bad { border-color: color-mix(in srgb, var(--bad) 60%, transparent); color: var(--bad); }
.pill.ok { color: var(--ok); }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 12px; font-size: 0.85rem; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 2px 9px; font-size: 0.8rem; }

.body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
nav.side { border-right: 1px solid var(--line); padding: 12px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
nav.side .grp { font-size: 0.7rem; letter-spacing: 0.08em; color: var(--muted); padding: 10px 10px 4px; text-transform: uppercase; }
nav.side button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; color: var(--muted); }
nav.side button:hover { background: var(--surface); color: var(--text); }
nav.side button[aria-current="page"] { background: var(--surface-2); color: var(--text); box-shadow: inset 2px 0 0 var(--gold); }
.count { font-variant-numeric: tabular-nums; font-size: 0.75rem; color: var(--muted); }
.count.bad { color: var(--bad); font-weight: 600; }

main { overflow-y: auto; padding: 18px 20px 40px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
.head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); flex-basis: 100%; max-width: 70ch; }
.work { display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(0, 360px); gap: 16px; align-items: start; }
.work.two { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); }
.work.lookw { grid-template-columns: 190px minmax(0, 0.9fr) minmax(0, 1.1fr); }
.stagewrap { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
canvas.stage3d { display: block; width: 100%; height: clamp(300px, 46vh, 460px); touch-action: pan-y; cursor: grab; }
.look-labels { position: absolute; inset: 0; pointer-events: none; }
.look-labels span { position: absolute; left: 0; top: 0; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: rgba(11,16,36,0.78); color: var(--text); white-space: nowrap; }
.look-labels span.sel { background: var(--gold); color: var(--gold-ink); }
.seg { display: inline-flex; gap: 0; }
.seg .btn { border-radius: 0; } .seg .btn:first-child { border-radius: 8px 0 0 8px; } .seg .btn:last-child { border-radius: 0 8px 8px 0; } .seg .btn + .btn { border-left: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.swatches input[type=color] { width: 40px; height: 28px; padding: 0 2px; }
input[type=color] { min-height: 30px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
input[type=color]:disabled { opacity: 0.6; cursor: not-allowed; }
.work > * { min-width: 0; }
.tablewrap select { min-width: 96px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.list .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 10px; }
.list .item:hover { background: var(--surface); }
.list .item[aria-selected="true"] { background: var(--surface-2); border-color: var(--line); }
.list .item small { color: var(--muted); margin-left: auto; font-size: 0.75rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.warnmark { color: var(--bad); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 1rem; font-weight: 600; }
.card h3 { margin: 14px 0 8px; font-size: 0.78rem; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; text-transform: uppercase; }
.card h3:first-child { margin-top: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.fields .full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; color: var(--text); width: 100%; min-width: 0; }
textarea { min-height: 64px; resize: vertical; }
input[type=number] { font-variant-numeric: tabular-nums; }
.slider { display: grid; grid-template-columns: 110px 1fr 36px; align-items: center; gap: 10px; font-size: 0.85rem; }
.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
input[type=range] { width: 100%; accent-color: var(--gold); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 0.75rem; white-space: nowrap; }
td input[type=number] { width: 68px; }
.chip { display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; font-size: 0.75rem; white-space: nowrap; }
.chip.low { color: var(--ok); } .chip.mid { color: var(--warn); } .chip.high, .chip.crit { color: var(--bad); }
.muted { color: var(--muted); }
.note { font-size: 0.8rem; color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 0.8rem; }

.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 120px 1fr 44px; align-items: center; gap: 8px; font-size: 0.85rem; }
.bar .track { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--blue); border-radius: 999px; }
.bar.win .fill { background: var(--gold); }
.bar.win span:first-child { color: var(--gold); font-weight: 600; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.why { margin-top: 10px; padding: 10px 12px; border-left: 2px solid var(--gold); background: var(--surface-2); border-radius: 0 8px 8px 0; }

.mapwrap { position: relative; }
canvas.map { width: 100%; aspect-ratio: 5 / 3; display: block; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); touch-action: none; }
.maptools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.btn[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
canvas.chart { width: 100%; height: 170px; display: block; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.kpi span { display: block; font-size: 0.75rem; color: var(--muted); }
.kpi b { font-size: 1.3rem; font-variant-numeric: tabular-nums; font-weight: 600; }
.log { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
.log div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; }
.log div span { color: var(--muted); font-variant-numeric: tabular-nums; }
.scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.scope .kpi small { color: var(--muted); }
.issues { display: flex; flex-direction: column; gap: 6px; }
.issues button { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.issues button:hover { border-color: var(--bad); }
.preview-quest { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); }
.preview-quest b { color: var(--gold); }
.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.phase { border-top: 3px solid var(--blue); padding-top: 6px; font-size: 0.8rem; min-width: 0; }
.phase:nth-child(3) { border-color: var(--warn); } .phase:nth-child(4) { border-color: var(--bad); } .phase:nth-child(5) { border-color: var(--ok); }
.ph { color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, transparent); border-radius: 4px; padding: 0 3px; }
.tok { cursor: pointer; }
.changed { color: var(--gold); font-weight: 700; }

.drawer { position: fixed; inset: auto 0 0 0; max-height: 60%; background: var(--surface); border-top: 1px solid var(--gold); padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.drawer[hidden] { display: none; }
.drawer pre { margin: 0; overflow: auto; background: var(--bg); border-radius: 8px; padding: 10px; font-family: var(--font-mono); font-size: 0.78rem; flex: 1; min-height: 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold); color: var(--gold-ink); padding: 6px 14px; border-radius: 999px; font-weight: 600; z-index: 20; }

@media (max-width: 1100px) { .work, .work.lookw { grid-template-columns: 190px minmax(0, 1fr); } .work > .preview { grid-column: 1 / -1; } }
@media (max-width: 760px) {
  .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav.side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 12px; }
  nav.side .grp { display: none; }
  nav.side button { width: auto; white-space: nowrap; }
  main { padding: 14px 16px 40px; }
  .work, .work.two, .work.lookw { grid-template-columns: 1fr; }
  .list { flex-direction: row; overflow-x: auto; }
  .list .item { width: auto; white-space: nowrap; }
  .fields { grid-template-columns: 1fr; }
  .slider { grid-template-columns: 96px 1fr 32px; }
  .phases { grid-template-columns: 1fr; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><b>Star Studio</b><span>พงศาวดารใต้ดวงดาว · ข้อมูลตัวอย่างจาก GDD</span></div>
    <div class="spacer"></div>
    <span class="saved" id="saved">ร่างบันทึกในเบราว์เซอร์นี้</span>
    <button class="pill" id="issues-pill" type="button"></button>
    <button class="btn" id="json-btn" type="button">ดู JSON</button>
    <button class="btn danger" id="reset-btn" type="button">คืนค่าตัวอย่าง</button>

  <div class="body">

</div>
<div class="drawer" id="drawer" hidden>

  <pre id="json-out"></pre>
</div>

// ======================= game rules (shared by previews + sim) =======================
function riskLevel(r) { const B = S.balance.party_combat; return r < B.risk_ratio_low_below ? ["low", "ต่ำ"] : r < B.risk_ratio_medium_below ? ["mid", "ปานกลาง"] : r < B.risk_ratio_high_below ? ["high", "สูง"] : ["crit", "วิกฤต"]; }
function partyPower(members, injured = {}) {
  const B = S.balance.party_combat; const roles = new Set(members.map((m) => m.role));
  const syn = roles.size > 1 ? 40 : 10;
  return members.reduce((s, m) => s + m.skills.combat * B.power_weight_combat_skill + 40 * B.power_weight_equipment + (injured[m.id] ? 0.5 : 1) * B.power_weight_health_ratio + syn * B.power_weight_role_synergy, 0);
}
function monsterPower(mon) { const node = byId(S.nodes, mon.habitat); return mon.threat * ((mon.gmin + mon.gmax) / 2) + (node ? RISK_BONUS[node.risk] : 0); }
function decide(n, sc) {
  const T = n.traits, K = n.skills;
  const risk = sc.threat * (1 - T.bravery / 200) * (1 - sc.info / 250);
  const unprep = sc.food < 2 ? (2 - sc.food) * 15 : 0;
  const options = [
    { name: "รับภารกิจทันที", parts: [["ตรงเป้าหมายช่วยหมู่บ้าน", 35 + T.ambition * 0.15 + T.generosity * 0.1], ["ทักษะเก็บของเหมาะ", K.gathering * 0.15], ["ความเสี่ยงของเส้นทาง", -risk * 0.6], ["เสบียงยังไม่พร้อม", -unprep * 1.2], ["ความเหนื่อย", -sc.fatigue * 0.25]] },
    { name: "เตรียมของก่อน", parts: [["ตรงเป้าหมายช่วยหมู่บ้าน", 28 + T.generosity * 0.08], ["ต้องเตรียมเสบียง", unprep * 1.4 + 8], ["นิสัยระมัดระวัง", T.caution * 0.18], ["ความเสี่ยงของเส้นทาง", -risk * 0.45], ["เสียเวลา", -10]] },
    { name: "พักหนึ่งช่วง", parts: [["ได้พักฟื้น", sc.fatigue * 0.55], ["นิสัยระมัดระวัง", T.caution * 0.08], ["เสียเวลา", -18], ["ยังคืบหน้าเป้าหมาย", 5]] },
    { name: "ปฏิเสธภารกิจ", parts: [["เลี่ยงภัย", risk * 0.5 * (T.caution / 100)], ["ขัดเป้าหมายช่วยหมู่บ้าน", -(25 + T.generosity * 0.15)]] },
  ];
  for (const o of options) o.score = o.parts.reduce((s, p) => s + p[1], 0);
  options.sort((a, b) => b.score - a.score);
  const best = options[0];
  const pos = best.parts.filter((p) => p[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 2).map((p) => p[0]);
  const neg = options.find((o) => o.name === "รับภารกิจทันที").parts.filter((p) => p[1] < -5).sort((a, b) => a[1] - b[1]).slice(0, 1).map((p) => p[0]);
  return { options, best, reason: `${n.name}เลือก "${best.name}" เพราะ${pos.join(" และ")}${neg.length && best.name !== "รับภารกิจทันที" ? ` (ถ้าออกทันที ติดที่${neg[0]})` : ""}` };
}
function priceIndex(stock, target) { const E = S.balance.economy; return clamp(Math.pow(target / Math.max(stock, 1), E.price_exponent), E.price_index_min, E.price_index_max); }
function fillTemplate(text, facts) { return text.replace(/\{(\w+)\}/g, (m, k) => (k in facts ? facts[k] : m)); }

function issues() {
  const out = []; const nodeIds = new Set(S.nodes.map((n) => n.id)); const npcIds = new Set(S.npcs.map((n) => n.id));
  for (const r of S.routes) {
    if (!nodeIds.has(r.a) || !nodeIds.has(r.b)) out.push({ sec: "world", id: r.id, kind: "route", msg: `เส้นทาง ${r.id} ชี้ไปสถานที่ที่ไม่มีแล้ว` });
    if (r.a === r.b) out.push({ sec: "world", id: r.id, kind: "route", msg: `เส้นทาง ${r.id} เริ่มและจบที่เดียวกัน` });
  }
  for (const n of S.nodes) if (!S.routes.some((r) => r.a === n.id || r.b === n.id)) out.push({ sec: "world", id: n.id, kind: "node", msg: `${n.name} ไม่มีเส้นทางเชื่อม NPC เดินทางไปไม่ได้` });
  for (const n of S.npcs) {
    if (!n.name.trim()) out.push({ sec: "npc", id: n.id, msg: `NPC ${n.id} ยังไม่มีชื่อ` });
    if (!nodeIds.has(n.home)) out.push({ sec: "npc", id: n.id, msg: `${n.name}: บ้านอยู่ในสถานที่ที่ไม่มีแล้ว` });
    for (const r of n.rel) { if (!npcIds.has(r.to)) out.push({ sec: "npc", id: n.id, msg: `${n.name}: มีความสัมพันธ์กับ NPC ที่ถูกลบไปแล้ว` }); if (r.to === n.id) out.push({ sec: "npc", id: n.id, msg: `${n.name}: ความสัมพันธ์ชี้หาตัวเอง` }); }
  }
  for (const m of S.monsters) { if (!nodeIds.has(m.habitat)) out.push({ sec: "monster", id: m.id, msg: `${m.name}: ถิ่นอาศัยไม่มีในแผนที่` }); if (m.gmin > m.gmax) out.push({ sec: "monster", id: m.id, msg: `${m.name}: จำนวนต่ำสุดมากกว่าสูงสุด` }); }
  for (const q of S.quests) if (!nodeIds.has(q.dest)) out.push({ sec: "quest", id: q.id, msg: `${q.name}: จุดหมายไม่มีในแผนที่` });
  if (S.crisis.outcomes.length < 3) out.push({ sec: "crisis", msg: `วิกฤตต้องมีผลลัพธ์อย่างน้อย 3 แนวทาง (ตอนนี้มี ${S.crisis.outcomes.length})` });
  for (const t of S.templates) { const allowed = EVENT_FIELDS[t.event] || {}; const bad = [...t.text.matchAll(/\{(\w+)\}/g)].map((m) => m[1]).filter((k) => !(k in allowed)); if (bad.length) out.push({ sec: "template", id: t.id, msg: `แม่แบบ ${t.id}: ใช้ช่องที่เหตุการณ์นี้ไม่มี {${bad.join("}, {")}}` }); }
  out.push(...lookIssues());
  if (!S.goods.some((g) => g.id === "medicine")) out.push({ sec: "good", msg: "ไม่มีสินค้า 'ยา' (medicine) ซึ่งวิกฤตและระบบจำลองต้องใช้" });
  return out;
}

  };

    if (s.grp) return `<div class="grp">${s.grp}</div>`;
    const n = iss.filter((i) => i.sec === s.id).length;
    return `<button type="button" data-sec="${s.id}"${ui.sec === s.id ? ' aria-current="page"' : ""}><span>${s.name}</span><span class="count${n ? " bad" : ""}">${n ? "⚠ " + n : counts[s.id] ?? ""}</span></button>`;
  }).join("");
  const pill = $("#issues-pill");
  pill.className = "pill " + (iss.length ? "bad" : "ok");

function drawMap() {
  const cv = $("#map"); if (!cv) return;
  const d = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * d; cv.height = h * d; const c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0);
  const k = w / 1000; c.clearRect(0, 0, w, h);
  c.strokeStyle = COLORS.line; c.lineWidth = 1; c.globalAlpha = 0.4;
  for (let x = 0; x <= 1000; x += 100) { c.beginPath(); c.moveTo(x * k, 0); c.lineTo(x * k, h); c.stroke(); }
  for (let y = 0; y <= 600; y += 100) { c.beginPath(); c.moveTo(0, y * k); c.lineTo(w, y * k); c.stroke(); }
  c.globalAlpha = 1;
  const pairs = {};
  for (const r of S.routes) {
    const a = byId(S.nodes, r.a), b = byId(S.nodes, r.b); if (!a || !b) continue;
    const key = [r.a, r.b].sort().join("|"); const idx = (pairs[key] = (pairs[key] || 0) + 1) - 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, nx = -(b.y - a.y), ny = b.x - a.x, nl = Math.hypot(nx, ny) || 1, off = idx * 70;
    const cx = mx + (nx / nl) * off, cy = my + (ny / nl) * off;
    const selR = ui.sel.world.kind === "route" && ui.sel.world.id === r.id;
    c.beginPath(); c.moveTo(a.x * k, a.y * k); c.quadraticCurveTo(cx * k, cy * k, b.x * k, b.y * k);
    c.setLineDash(r.danger === "watch" ? [7, 6] : r.danger === "danger" ? [3, 5] : []);
    c.strokeStyle = r.danger === "danger" ? COLORS.bad : COLORS.gold; c.globalAlpha = r.danger === "safe" ? 0.8 : 0.95; c.lineWidth = selR ? 4 : 2; c.stroke(); c.setLineDash([]); c.globalAlpha = 1;
    const lx = (a.x + 2 * cx + b.x) / 4, ly = (a.y + 2 * cy + b.y) / 4; r._lx = lx; r._ly = ly;
    c.fillStyle = COLORS.surface; c.beginPath(); c.arc(lx * k, ly * k, 11, 0, Math.PI * 2); c.fill();
    c.fillStyle = COLORS.text; c.font = "600 11px Sarabun, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(r.days + "ว", lx * k, ly * k);
  }
  for (const n of S.nodes) {
    const selN = ui.sel.world.kind === "node" && ui.sel.world.id === n.id, linkN = ui.linkFrom === n.id;
    const r = n.type === "village" || n.type === "town" ? 12 : 10;
    const g = c.createRadialGradient(n.x * k, n.y * k, 0, n.x * k, n.y * k, r * 3); g.addColorStop(0, "rgba(227,191,99,0.55)"); g.addColorStop(1, "rgba(227,191,99,0)");
    c.fillStyle = g; c.beginPath(); c.arc(n.x * k, n.y * k, r * 3, 0, Math.PI * 2); c.fill();
    c.fillStyle = n.risk === "high" ? COLORS.bad : n.risk === "midhigh" || n.risk === "mid" ? COLORS.warn : COLORS.ok;

    c.fillStyle = COLORS.text; c.font = "600 13px Sarabun, sans-serif"; c.textAlign = "center"; c.textBaseline = "bottom"; c.fillText(n.name, n.x * k, n.y * k - r - 4);
    c.fillStyle = COLORS.muted; c.font = "11px Sarabun, sans-serif"; c.textBaseline = "top"; c.fillText(NODE_TYPES[n.type] + " · เสี่ยง" + RISK[n.risk], n.x * k, n.y * k + r + 3);
  }
}
let mapDrag = null;
function mapPoint(e) { const cv = $("#map"), r = cv.getBoundingClientRect(), k = r.width / 1000; return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k }; }
function hitMap(p) {
  for (const n of S.nodes) if (Math.hypot(n.x - p.x, n.y - p.y) < 24) return { kind: "node", id: n.id };
  for (const r of S.routes) if (r._lx != null && Math.hypot(r._lx - p.x, r._ly - p.y) < 22) return { kind: "route", id: r.id };

document.addEventListener("pointerdown", (e) => {

});
document.addEventListener("pointermove", (e) => {

function goodPreview() {
  const g = byId(S.goods, ui.sel.good); const el = $("#good-preview"); if (!g || !el) return;
  const target = g.daily * S.balance.economy.target_stock_days, E = S.balance.economy;

function powerPreview() {
  const el = $("#power-preview"); if (!el) return; const P = S.balance.powers, I = S.balance.influence;
  const budget = Math.min(I.cap, I.start) + I.regen_per_day * 10;
  const rows = Object.values(P).map((p) => { const byCost = Math.floor(budget / Math.max(p.cost, 1)), byCd = p.cd > 0 ? Math.floor(40 / p.cd) : Infinity; return { p, n: Math.min(byCost, byCd) }; });
  const max = Math.max(...rows.map((r) => r.n), 1);
  el.innerHTML = `<p class="note" style="margin:0 0 10px">แต้มที่มีใน 10 วัน ≈ เริ่ม ${Math.min(I.cap, I.start)} + ฟื้น ${I.regen_per_day * 10} = <b>${budget}</b> (ถ้าใช้พลังชนิดเดียวตลอด)</p>
    <div class="bars">${rows.map((r) => `<div class="bar"><span>${esc(r.p.name)}${r.p.mvp ? "" : ' <small class="muted">(หลัง MVP)</small>'}</span><div class="track"><div class="fill" style="width:${(r.n / max) * 100}%"></div></div><b>${r.n}</b></div>`).join("")}</div>

  <div class="card" style="margin-top:16px"><h2>สีและของประจำอาชีพ</h2><p class="note" style="margin:0 0 8px">NPC ที่ติ๊ก "ใช้สีประจำอาชีพ" จะเปลี่ยนตามตารางนี้ ใช้เป็นค่าเริ่มต้นตอนระบบสร้าง NPC ใหม่</p>
    <div class="tablewrap"><table><thead><tr><th>อาชีพ</th><th>สีหลัก</th><th>สีรอง</th><th>ชุด</th><th>ของถือ</th><th>หมวก</th><th>จำนวน NPC</th></tr></thead><tbody>
    ${ROLES.map((role) => { const P = S.rolePalette[role]; return `<tr><td>${esc(role)}</td><td><input type="color" id="rp-${role}-main" data-rp="${role}|main" value="${P.main}"></td><td><input type="color" id="rp-${role}-accent" data-rp="${role}|accent" value="${P.accent}"></td><td><select id="rp-${role}-outfit" data-rp="${role}|outfit">${opts(Object.entries(OUTFITS), P.outfit)}</select></td><td><select id="rp-${role}-prop" data-rp="${role}|prop">${opts(Object.entries(PROPS), P.prop)}</select></td><td><select id="rp-${role}-hat" data-rp="${role}|hat">${opts(Object.entries(HATS), P.hat)}</select></td><td class="mono">${S.npcs.filter((x) => x.role === role).length}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
}
function lookAttach() {
  if (ui.sec !== "look" || !look3d.ok) return; initLook3d(); syncRigs();
  const st = document.getElementById("look-stage"); if (st && look3d.canvas.parentNode !== st) st.insertBefore(look3d.canvas, st.firstChild);
}

const SEC_FN = { look: secLook, overview: secOverview, world: secWorld, npc: secNPC, monster: secMonster, good: secGood, quest: secQuest, crisis: secCrisis, template: secTemplate, power: secPower, balance: secBalance, sim: secSim };
function derived() { lookAttach(); npcPreview(); monPreview(); goodPreview(); questPreview(); tplPreview(); powerPreview(); simOut(); drawMap(); renderNav(); }
function render() { $("#main").innerHTML = SEC_FN[ui.sec](); derived(); if (ui.sec === "sim" && !ui.simResult) { ui.simResult = simulate(ui.sim); simOut(); } }
function changed(full) { save(); if (ui.sec === "sim") ui.simResult = simulate(ui.sim); else ui.simResult = null; if (full) render(); else derived(); }

const main = $("#main");
main.addEventListener("input", (e) => {
  const t = e.target, out = t.id && document.querySelector(`[data-out="${t.id}"]`); if (out) out.textContent = t.value;
  if (t.dataset.col) {
    const col = t.dataset.col, item = byId(S[col], t.dataset.id); if (!item) return;
    let v = t.dataset.num ? Number(t.value) : t.value; if (t.dataset.num && Number.isNaN(v)) return;
    setPath(item, t.dataset.field, v);
    if (t.dataset.field === "name") { const lab = document.querySelector(`[data-label="${CSS.escape(item.id)}"]`); if (lab) lab.textContent = v || "(ไม่มีชื่อ)"; }
    changed(t.tagName === "SELECT" && ["role", "event", "kind", "threat", "a", "b"].includes(t.dataset.field)); return;
  }
  if (t.dataset.look) {
    const n = byId(S.npcs, ui.sel.look); if (!n) return; const f = t.dataset.look;
    n.look[f] = t.type === "checkbox" ? t.checked : t.dataset.pct ? Number(t.value) / 100 : t.value;
    if (f === "main" || f === "useRole") n.color = lookOf(n).main;
    save(); syncRigs(); renderNav();
    if (["useRole", "hair", "hat", "prop", "hairColor", "main", "outfit", "beard"].includes(f) && t.type !== "color") render();
    return;
  }
  if (t.dataset.rp) {
    const [role, k] = t.dataset.rp.split("|"); S.rolePalette[role][k] = t.value;
    for (const n of S.npcs) if (n.role === role && n.look.useRole) n.color = lookOf(n).main;
    save(); syncRigs(); renderNav(); if (t.tagName === "SELECT") render(); return;
  }
  if (t.dataset.sc) { ui.sc[t.dataset.sc] = Number(t.value); npcPreview(); return; }
  if (t.dataset.stock) { ui.stock = Number(t.value); goodPreview(); return; }
  if (t.dataset.rel != null) { const n = byId(S.npcs, ui.sel.npc); const r = n.rel[+t.dataset.rel]; r[t.dataset.rf] = ["trust", "affinity", "respect", "grievance"].includes(t.dataset.rf) ? clamp(Number(t.value) || 0, 0, 100) : t.value; changed(); return; }
  if (t.dataset.cr) { S.crisis[t.dataset.cr] = t.value; changed(); return; }
  if (t.dataset.ph != null) { S.crisis.phases[+t.dataset.ph][t.dataset.pf] = t.value; changed(); return; }
  if (t.dataset.oc != null) { S.crisis.outcomes[+t.dataset.oc][t.dataset.of] = t.value; changed(); return; }
  if (t.dataset.bal) { const v = t.dataset.bool ? t.checked : Number(t.value); if (!t.dataset.bool && Number.isNaN(v)) return; setPath(S.balance, t.dataset.bal, v); save(); ui.simResult = null; powerPreview(); renderNav(); if (ui.sec === "balance") { clearTimeout(main._bt); main._bt = setTimeout(() => { const a = document.activeElement && document.activeElement.id; render(); if (a) { const el = document.getElementById(a); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (er) {} } } }, 700); } return; }
  if (t.dataset.party) { ui.party = [...document.querySelectorAll("[data-party]:checked")].map((x) => x.dataset.party); monPreview(); return; }
  if (t.dataset.sim) { const k = t.dataset.sim; ui.sim[k] = k === "omen" ? t.value === "true" : k === "death" ? t.value : Number(t.value); if (k === "days") ui.sim.days = clamp(ui.sim.days || 30, 5, 120); return; }
});
main.addEventListener("change", (e) => { if (e.target.dataset.party) { ui.party = [...document.querySelectorAll("[data-party]:checked")].map((x) => x.dataset.party); monPreview(); } if (e.target.dataset.bool) main.dispatchEvent(new Event("input")); });
main.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]"); if (pick) { ui.sel[ui.sec] = pick.dataset.pick; ui.confirm = null; render(); return; }
  const gt = e.target.closest("[data-goto]"); if (gt) { const sec = gt.dataset.goto, id = gt.dataset.gotoId; go(sec, id ? (sec === "world" ? { kind: gt.dataset.gotoKind || "node", id } : id) : null); return; }
  const tok = e.target.closest("[data-tok]"); if (tok) { const ta = document.querySelector("textarea[data-field='text']"); const t = byId(S.templates, ui.sel.template); if (ta && t) { const p = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, p) + "{" + tok.dataset.tok + "}" + ta.value.slice(p); t.text = ta.value; changed(); ta.focus(); } return; }
  const rb = e.target.closest("[data-reset-bal]"); if (rb) { setPath(S.balance, rb.dataset.resetBal, getPath(DEFAULT.balance, rb.dataset.resetBal)); changed(true); return; }
  const sk = e.target.closest("[data-skin]"); if (sk) { const n = byId(S.npcs, ui.sel.look); n.look.skin = sk.dataset.skin; save(); render(); return; }
  const l3 = e.target.closest("[data-look3d]"); if (l3) { const [k, v] = l3.dataset.look3d.split(":"); look3d[k] = v; render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return; const act = b.dataset.act;
  if (act === "look-random" || act === "look-role") {
    const n = byId(S.npcs, ui.sel.look); if (!n) return;
    if (act === "look-random") n.look = { ...randomLook(n.role), name: undefined };
    else { const P = S.rolePalette[n.role]; Object.assign(n.look, { outfit: P.outfit, prop: P.prop, hat: P.hat, useRole: true }); }
    delete n.look.name; n.color = lookOf(n).main; changed(true); return;
  }
  const n = byId(S.npcs, ui.sel.npc);
  if (act === "add-npc") { const id = newId("npc", S.npcs); S.npcs.push({ id, name: "NPC ใหม่", role: "ชาวนา", home: S.nodes[0]?.id || "", color: "#8fa0c8", traits: { bravery: 50, caution: 50, generosity: 50, ambition: 50, sociability: 50 }, skills: { combat: 20, gathering: 30, healing: 10, crafting: 20, negotiation: 20 }, goalShort: "", goalLong: "", rel: [] }); ensureLooks(); ui.sel.npc = id; ui.sel.look = id; changed(true); }
  else if (act === "add-rel" && n) { const other = S.npcs.find((x) => x.id !== n.id && !n.rel.some((r) => r.to === x.id)) || S.npcs.find((x) => x.id !== n.id); n.rel.push({ to: other.id, trust: 50, affinity: 50, respect: 50, grievance: 0, why: "" }); changed(true); }
  else if (act === "del-rel" && n) { n.rel.splice(+b.dataset.i, 1); changed(true); }
  else if (act === "add-monster") { const id = newId("monster", S.monsters); S.monsters.push({ id, name: "มอนสเตอร์ใหม่", kind: "common", habitat: S.nodes.find((x) => x.type === "wild")?.id || S.nodes[0]?.id, threat: 10, gmin: 1, gmax: 3, behavior: "", drops: "" }); ui.sel.monster = id; changed(true); }
  else if (act === "add-good") { const id = newId("good", S.goods); S.goods.push({ id, name: "สินค้าใหม่", cat: "", base: 5, shelf: 30, daily: 1, sub: "" }); ui.sel.good = id; changed(true); }
  else if (act === "add-quest") { const id = newId("quest", S.quests); S.quests.push({ id, name: "ภารกิจใหม่", trigger: "", issuer: ROLES[0], dest: S.nodes[0]?.id, threat: "mid", reward: "", success: "", fail: "", effect: "" }); ui.sel.quest = id; changed(true); }
  else if (act === "add-template") { const id = newId("tpl", S.templates); S.templates.push({ id, event: "npc_injured", text: "{npc}…" }); ui.sel.template = id; changed(true); }
  else if (act === "add-oc") { S.crisis.outcomes.push({ name: "ผลลัพธ์ใหม่", cond: "", effect: "" }); changed(true); }
  else if (act === "del-oc") { S.crisis.outcomes.splice(+b.dataset.i, 1); changed(true); }
  else if (act === "add-node") { const id = newId("place", S.nodes); S.nodes.push({ id, name: "สถานที่ใหม่", type: "wild", risk: "mid", x: 500, y: 300, res: "" }); ui.sel.world = { kind: "node", id }; changed(true); }
  else if (act === "link") { ui.link = !ui.link; ui.linkFrom = null; render(); }
  else if (act === "ask-del") { ui.confirm = b.dataset.key; render(); }
  else if (act === "cancel-del") { ui.confirm = null; render(); }
  else if (act === "confirm-del") {
    const [kind, id] = ui.confirm.split(":"); const map = { node: "nodes", route: "routes", npc: "npcs", monster: "monsters", good: "goods", quest: "quests", template: "templates" };
    S[map[kind]] = S[map[kind]].filter((x) => x.id !== id); ui.confirm = null;
    if (kind === "node" || kind === "route") ui.sel.world = { kind: "node", id: S.nodes[0]?.id }; else ui.sel[kind] = (S[map[kind]][0] || {}).id;
    toast("ลบแล้ว"); changed(true);
  }
  else if (act === "run-sim") { ui.simResult = simulate(ui.sim); simOut(); toast("รันเสร็จ seed " + ui.sim.seed); }
  else if (act === "new-seed") { ui.sim.seed = Math.floor(Math.random() * 99999); ui.simResult = simulate(ui.sim); render(); }
});

// top bar
$("#json-btn").addEventListener("click", () => {
  const d = $("#drawer"); if (!d.hidden) { d.hidden = true; return; }
  const pick = { world: { nodes: S.nodes, routes: S.routes.map(({ _lx, _ly, ...r }) => r) }, npc: { npcs: S.npcs }, look: { rolePalette: S.rolePalette, looks: Object.fromEntries(S.npcs.map((n) => [n.id, n.look])) }, monster: { monsters: S.monsters }, good: { goods: S.goods }, quest: { quests: S.quests }, crisis: { crisis: S.crisis }, template: { templates: S.templates }, power: { powers: S.balance.powers, influence: S.balance.influence }, balance: { balance: S.balance } }[ui.sec];
  const file = { world: "world.json", npc: "npcs.json", look: "character_looks.json", monster: "monsters.json", good: "goods.json", quest: "quests.json", crisis: "crisis.json", template: "chronicle_templates.json", power: "balance.json (powers)", balance: "balance.json" }[ui.sec];
  $("#drawer-title").textContent = pick ? "data/" + file : "ทั้งโครงการ";
  $("#json-out").textContent = JSON.stringify(pick || { ...S, routes: S.routes.map(({ _lx, _ly, ...r }) => r) }, null, 2); d.hidden = false;
});
$("#close-json").addEventListener("click", () => { $("#drawer").hidden = true; });
$("#copy-json").addEventListener("click", () => {
  const txt = $("#json-out").textContent;
  navigator.clipboard.writeText(txt).then(() => toast("คัดลอกแล้ว"), () => { const r = document.createRange(); r.selectNodeContents($("#json-out")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("เลือกข้อความไว้แล้ว กด Ctrl+C"); });
});
const resetBtn = $("#reset-btn");
resetBtn.addEventListener("click", () => {
  if (resetBtn.dataset.armed) { S = clone(DEFAULT); ensureLooks(); try { localStorage.removeItem(KEY); } catch (e) {} delete resetBtn.dataset.armed; resetBtn.textContent = "คืนค่าตัวอย่าง"; ui.simResult = null; toast("คืนค่าตัวอย่างแล้ว"); render(); return; }
  resetBtn.dataset.armed = "1"; resetBtn.textContent = "กดอีกครั้งเพื่อยืนยัน"; setTimeout(() => { delete resetBtn.dataset.armed; resetBtn.textContent = "คืนค่าตัวอย่าง"; }, 3000);
});
window.addEventListener("resize", () => { drawMap(); goodPreview(); simOut(); });

const start = (location.hash || "").slice(1); if (SEC_FN[start]) ui.sec = start;
render();
})();
</script>
</body>
</html>
