<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>มุมมองกลุ่มดาว 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Trirong:wght@500;700&display=swap">
<style>
/* Layout: full-screen WebGL view (space → clouds → 3D valley seen from the sky), floating top bar, info panel right (collapsible bottom sheet on phones), zoom dock at bottom. Deliberately single dark "night sky" look. */
:root {
  --void: #070b1a;
  --panel: rgba(13, 20, 44, 0.88);
  --line: #2b3868;
  --gold: #e8c46a;
  --gold-soft: #a88c4a;
  --text: #e9ecf7;
  --muted: #9aa5c9;
  --danger: #f08a5d;
  --ok: #7fd1b9;
  --font-display: "Trirong", "Sarabun", Georgia, serif;
  --font-ui: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--text); font-family: var(--font-ui); font-size: 15px; overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#gl, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; cursor: grab; }
#overlay { pointer-events: none; }
#clouds { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at 30% 40%, #ffffff 0%, rgba(240,244,255,0.9) 35%, rgba(220,230,250,0.6) 60%, rgba(200,214,245,0.2) 100%),
              radial-gradient(ellipse at 75% 65%, #f6f8ff 0%, rgba(235,240,255,0.7) 45%, rgba(220,230,250,0) 80%); }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; font-size: 12px; font-weight: 600;
  padding: 1px 8px; border-radius: 999px; background: rgba(13,20,44,0.78); color: var(--text); border: 1px solid rgba(232,196,106,0.25); }
.lbl.place { font-size: 13px; color: #f4e6bf; background: rgba(13,20,44,0.6); }
.lbl.building { font-size: 11px; font-weight: 400; color: var(--muted); background: rgba(13,20,44,0.5); border-color: transparent; }
.lbl.danger { color: var(--danger); border-color: rgba(240,138,93,0.4); }
.lbl.party { color: #1a1206; background: var(--gold); border-color: var(--gold); }
.lbl.sel { color: #1a1206; background: var(--gold); border-color: var(--gold); }
.lbl.clickable { pointer-events: auto; cursor: pointer; }

.topbar { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; background: linear-gradient(rgba(7,11,26,0.85), transparent); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--gold); text-wrap: balance; }
.brand small { display: block; font-family: var(--font-ui); font-weight: 400; font-size: 0.78rem; color: var(--muted); }
.clock { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock-text { font-variant-numeric: tabular-nums; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 0.88rem; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: 0.85rem; color: var(--muted); background: transparent; border: 0; padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--void); background: var(--gold); font-weight: 600; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.panel { position: absolute; right: 16px; top: 84px; width: min(320px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(6px); }
.panel .eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; color: var(--gold-soft); }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); line-height: 1.55; }
.panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; }
.panel dt { color: var(--gold-soft); font-size: 0.85rem; white-space: nowrap; }
.panel dd { margin: 0; line-height: 1.45; min-width: 0; }
.chip { display: inline-block; font-size: 0.78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.chip.bad { color: var(--danger); } .chip.good { color: var(--ok); }
.panel .note { font-size: 0.78rem; border-top: 1px solid var(--line); padding-top: 10px; }
.panel button.link { align-self: flex-start; font: inherit; font-size: 0.85rem; color: var(--gold); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.panel .summary { color: var(--text); display: none; }
.panel .toggle { display: none; }

.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; background: linear-gradient(transparent, rgba(7,11,26,0.9)); }
.dock .levels { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.dock .levels button { font: inherit; font-size: 0.9rem; color: var(--muted); background: transparent; border: 0; padding: 8px 14px; cursor: pointer; }
.dock .levels button + button { border-left: 1px solid var(--line); }
.dock .levels button[aria-pressed="true"] { color: var(--void); background: var(--gold); font-weight: 600; }
.dock .tour { font: inherit; font-size: 0.9rem; color: var(--gold); background: var(--panel); border: 1px solid var(--gold-soft); border-radius: 12px; padding: 8px 14px; cursor: pointer; }
.dock .cam { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.dock .cam button { font: inherit; font-size: 1.05rem; line-height: 1; color: var(--gold); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
.dock .cam button + button { border-left: 1px solid var(--line); }
.hint { width: 100%; text-align: center; font-size: 0.78rem; color: var(--muted); }
.hint .touch { display: none; }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

@media (max-width: 720px) {
  .topbar { gap: 6px; padding-bottom: 6px; }
  .brand { font-size: 1.05rem; } .brand small { display: none; }
  .clock { margin-left: 0; width: 100%; justify-content: space-between; flex-wrap: nowrap; }
  .clock-text { font-size: 0.8rem; padding: 4px 10px; }
  .seg button { padding: 5px 9px; font-size: 0.8rem; }
  .panel { top: auto; right: 16px; left: 16px; width: auto; bottom: var(--dock-h, 112px); max-height: 46%; overflow-y: auto; padding: 10px 12px; gap: 6px; }
  .panel h2 { font-size: 1rem; }
  .panel .note { display: none; }
  .panel .toggle { display: block; position: absolute; top: 8px; right: 10px; font: inherit; font-size: 0.8rem; color: var(--gold); background: none; border: 0; padding: 4px; cursor: pointer; }
  .panel.collapsed > :not(.eyebrow):not(h2):not(.summary):not(.toggle) { display: none; }
  .panel.collapsed .summary { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .dock { padding-top: 8px; gap: 6px; }
  .dock .levels button, .dock .tour { padding: 7px 11px; font-size: 0.85rem; }
  .dock .cam button { padding: 6px 10px; }
  .hint .mouse { display: none; } .hint .touch { display: inline; }
}
</style>
</head>
<body>

<div id="app">
  <canvas id="gl" aria-label="โลก 3D มองจากกลุ่มดาว ซูมและหมุนได้"></canvas>
  <canvas id="overlay"></canvas>
  <div id="labels"></div>
  <div id="clouds"></div>

  <header class="topbar">
    <div class="brand">พงศาวดารใต้ดวงดาว<small>ทดลองมุมมอง 3D: มองเฉียงจากฟ้า</small></div>
    <div class="clock">
      <span class="clock-text" id="clock">วัน 14 · ฤดูฝน · เช้า</span>
      <div class="seg" role="group" aria-label="ความเร็วเวลา">
        <button id="sp-pause" aria-pressed="false">หยุด</button>
        <button id="sp-1" aria-pressed="true">ปกติ</button>
        <button id="sp-4" aria-pressed="false">เร็ว ×4</button>
      </div>
    </div>
  </header>

  <aside class="panel collapsed" id="panel" aria-live="polite"></aside>

  <nav class="dock" aria-label="ระดับการซูม">
    <div class="levels" role="group">
      <button id="lv-0" aria-pressed="true">อวกาศ</button>
      <button id="lv-1" aria-pressed="false">ภูมิภาค</button>
      <button id="lv-2" aria-pressed="false">หมู่บ้านลูเมน</button>
    </div>
    <div class="cam" role="group" aria-label="หมุนกล้อง">
      <button id="rot-l" aria-label="หมุนกล้องไปทางซ้าย">⟲</button><button id="rot-r" aria-label="หมุนกล้องไปทางขวา">⟳</button>
    </div>
    <button class="tour" id="tour">ดูการซูมต่อเนื่อง</button>
    <div class="hint"><span class="mouse">ลาก = เลื่อนดู · คลิกขวาลาก = หมุน · ลูกกลิ้ง = ซูม · คลิกพื้นที่หรือป้ายชื่อ = บินไปดู</span><span class="touch">ลากนิ้ว = เลื่อนดู · ถ่างนิ้ว = ซูม · ⟲ ⟳ = หมุน · แตะพื้นที่หรือป้าย = บินไปดู</span></div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  "use strict";
  if (!window.THREE) { document.getElementById("app").insertAdjacentHTML("beforeend", '<div id="fail">โหลดระบบ 3D ไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง</div>'); return; }
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function hash3(x, y, z) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function vnoise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    let r = 0;
    for (let dz = 0; dz < 2; dz++) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++)
      r += (dx ? u : 1 - u) * (dy ? v : 1 - v) * (dz ? w : 1 - w) * hash3(xi + dx, yi + dy, zi + dz);
    return r;
  }
  const fbm = (x, y, z) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, y * f, z * f); a *= 0.5; f *= 2; } return s / 0.97; };
  let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const C = (h) => new THREE.Color(h);

  // ---------- renderer ----------
  const glCanvas = document.getElementById("gl");
  const overlay = document.getElementById("overlay"), octx = overlay.getContext("2d");
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  let W = 1, H = 1, narrow = false;
  const camSpace = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
  const camWorld = new THREE.PerspectiveCamera(48, 1, 0.5, 3000);
  function resize() {
    W = glCanvas.clientWidth; H = glCanvas.clientHeight; narrow = W <= 720;
    renderer.setSize(W, H, false);
    camSpace.aspect = camWorld.aspect = W / H; camSpace.updateProjectionMatrix(); camWorld.updateProjectionMatrix();
    const d = Math.min(window.devicePixelRatio || 1, 2);
    overlay.width = W * d; overlay.height = H * d; octx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // =========================================================
  // SPACE SCENE: planet + stars
  // =========================================================
  const space = new THREE.Scene();
  space.background = C("#070b1a");
  {
    const g = new THREE.BufferGeometry(), pos = [];
    for (let i = 0; i < 1500; i++) { const v = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize().multiplyScalar(40 + rnd() * 20); pos.push(v.x, v.y, v.z); }
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    space.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xdde6ff, size: 0.12, sizeAttenuation: true })));
  }
  // planet texture generated from the sphere's own UV layout so the marker sits on real land
  const TW = 512, TH = 256;
  const texCanvas = document.createElement("canvas"); texCanvas.width = TW; texCanvas.height = TH;
  const tctx = texCanvas.getContext("2d"), timg = tctx.createImageData(TW, TH);
  const heightAt = new Float32Array(TW * TH);
  const localDir = (i, j) => { const phi = ((i + 0.5) / TW) * Math.PI * 2, th = ((j + 0.5) / TH) * Math.PI; return [-Math.cos(phi) * Math.sin(th), Math.cos(th), Math.sin(phi) * Math.sin(th)]; };
  for (let j = 0; j < TH; j++) for (let i = 0; i < TW; i++) {
    const [x, y, z] = localDir(i, j);
    const n = fbm(x * 1.8 + 5, y * 1.8 + 5, z * 1.8 + 5); heightAt[j * TW + i] = n;
    let c = Math.abs(y) > 0.93 ? [222, 230, 236] : n < 0.47 ? [15, 47, 92] : n < 0.5 ? [42, 106, 163] : n < 0.53 ? [185, 168, 115] : n < 0.6 ? [95, 145, 71] : n < 0.67 ? [63, 109, 52] : n < 0.72 ? [125, 109, 82] : [217, 214, 204];
    const k = (j * TW + i) * 4; timg.data[k] = c[0]; timg.data[k + 1] = c[1]; timg.data[k + 2] = c[2]; timg.data[k + 3] = 255;
  }
  tctx.putImageData(timg, 0, 0);
  let markLocal = new THREE.Vector3(0.3, 0.6, 0.74).normalize();
  { const j = Math.round(TH * 0.32); for (let i = 0; i < TW; i++) { const n = heightAt[j * TW + i]; if (n > 0.56 && n < 0.63) { markLocal = new THREE.Vector3(...localDir(i, j)); break; } } }
  const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(texCanvas) }));
  space.add(planet);
  // cloud shell + atmosphere glow
  {
    const cc = document.createElement("canvas"); cc.width = 512; cc.height = 256; const cx = cc.getContext("2d"), ci = cx.createImageData(512, 256);
    for (let j = 0; j < 256; j++) for (let i = 0; i < 512; i++) {
      const phi = (i / 512) * Math.PI * 2, th = (j / 256) * Math.PI;
      const n = fbm(-Math.cos(phi) * Math.sin(th) * 3 + 20, Math.cos(th) * 3, Math.sin(phi) * Math.sin(th) * 3);
      const a = clamp((n - 0.55) * 4, 0, 1); const k = (j * 512 + i) * 4; ci.data[k] = ci.data[k + 1] = ci.data[k + 2] = 255; ci.data[k + 3] = a * 200;
    }
    cx.putImageData(ci, 0, 0);
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.012, 64, 48), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(cc), transparent: true, depthWrite: false }));
    planet.add(clouds); planet.userData.clouds = clouds;
    const gc = document.createElement("canvas"); gc.width = gc.height = 256; const gx = gc.getContext("2d");
    const gr = gx.createRadialGradient(128, 128, 80, 128, 128, 128); gr.addColorStop(0, "rgba(120,180,255,0.55)"); gr.addColorStop(1, "rgba(120,180,255,0)");
    gx.fillStyle = gr; gx.fillRect(0, 0, 256, 256);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gc), depthWrite: false, transparent: true }));
    glow.scale.set(3.2, 3.2, 1); space.add(glow);
  }
  space.add(new THREE.AmbientLight(0x6070a0, 0.35));
  const spaceSun = new THREE.DirectionalLight(0xfff2dd, 1.15); spaceSun.position.set(-3, 2, 4); space.add(spaceSun);
  const markerTargetY = Math.atan2(-markLocal.x, markLocal.z);
  const markerTargetX = Math.atan2(markLocal.y, Math.hypot(markLocal.x, markLocal.z));
  let autoY = markerTargetY - 0.9;

  // =========================================================
  // WORLD SCENE: valley seen from the sky
  // =========================================================
  const world = new THREE.Scene();
  const fog = new THREE.Fog(0x9fc3e6, 300, 1100); world.fog = fog;
  const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x4a5a3a, 0.65); world.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d8, 0.9); world.add(sun); world.add(sun.target);
  const lambert = (c, extra = {}) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, extra));

  const VILLAGE_R = 55;
  let terrain = null;
  function hgt(x, z) {
    const r = Math.hypot(x, z);
    let h = (fbm(x * 0.011 + 3, z * 0.011 + 7, 0.5) - 0.42) * 70 * smooth(VILLAGE_R, 120, r);
    h += 34 * Math.exp(-((x + 150) ** 2 + (z - 125) ** 2) / 2600);
    h += 20 * Math.exp(-((x - 175) ** 2 + (z - 95) ** 2) / 1200);
    return Math.max(h, -3);
  }
  // terrain
  {
    const g = new THREE.PlaneGeometry(900, 900, 150, 150); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, cols = [];
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), h = hgt(x, z); p.setY(i, h);
      const c = h > 26 ? C("#8d8a7c") : h > 14 ? C("#6f8a4c") : C("#7fa356");
      c.offsetHSL(0, 0, (hash3(Math.round(x), Math.round(z), 1) - 0.5) * 0.05); cols.push(c.r, c.g, c.b);
    }
    g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3)); g.computeVertexNormals();
    terrain = new THREE.Mesh(g, new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 0 })); world.add(terrain);
    const water = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshLambertMaterial({ color: 0x3f7fb5, transparent: true, opacity: 0.85 }));
    water.rotation.x = -Math.PI / 2; water.position.y = -1.2; world.add(water);
  }
  // paths as ribbons following the ground
  const ROUTE_NORTH = [[58, 3], [100, -40], [150, -80], [200, -110]];
  const ROUTE_SOUTH = [[58, 3], [95, 45], [150, 40], [185, -20], [200, -110]];
  function densify(pts, step = 3) {
    const out = [];
    for (let i = 1; i < pts.length; i++) {
      const [ax, az] = pts[i - 1], [bx, bz] = pts[i], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, bz - az) / step));
      for (let k = 0; k < n; k++) out.push([lerp(ax, bx, k / n), lerp(az, bz, k / n)]);
    }
    out.push(pts[pts.length - 1]); return out;
  }
  function ribbon(pts, width, color) {
    const d = densify(pts), pos = [], idx = [];
    d.forEach(([x, z], i) => {
      const [nx, nz] = d[Math.min(i + 1, d.length - 1)], [px, pz] = d[Math.max(i - 1, 0)];
      let tx = nx - px, tz = nz - pz; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
      const ox = -tz * width / 2, oz = tx * width / 2;
      pos.push(x + ox, hgt(x + ox, z + oz) + 0.3, z + oz, x - ox, hgt(x - ox, z - oz) + 0.3, z - oz);
      if (i) { const a = (i - 1) * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    });
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide })); world.add(m); return m;
  }
  ribbon([[-60, 3], [58, 3]], 6, 0xc2a676);
  ribbon(ROUTE_SOUTH, 3.5, 0xb59a6a);
  ribbon(ROUTE_NORTH, 3.5, 0x9a6a50);
  ribbon([[-58, 3], [-120, -60], [-190, -150]], 3.5, 0xb59a6a);
  ribbon([[-20, 6], [-80, 70], [-140, 110]], 3, 0xb59a6a);
  ribbon([[200, -110], [175, 95]], 3, 0xb59a6a);

  // trees (instanced)
  {
    const spots = [];
    for (let i = 0; i < 900; i++) {
      const forest = i < 380;
      const x = forest ? 200 + (rnd() - 0.5) * 150 : (rnd() - 0.5) * 820, z = forest ? -110 + (rnd() - 0.5) * 130 : (rnd() - 0.5) * 820;
      if (Math.hypot(x, z) < VILLAGE_R + 8) continue;

      renderer.render(world, camWorld);
    }
    drawOverlay(zoom, time, markerScreen);
    cloudsEl.style.opacity = (smooth(0.7, 0.9, zoom) * (1 - smooth(0.9, 1.03, zoom))).toFixed(3);
    updateLabels();

    const level = levelOf(zoom);
    lv.forEach((b, i) => b.setAttribute("aria-pressed", i === levelOf(zoomTarget)));
    const ct = `วัน ${14 + Math.floor(t / 4)} · ฤดูฝน · ${PERIODS[Math.floor(((t % 4) + 4) % 4)]}`;
    if (ct !== clockText) { clockText = ct; clockEl.textContent = ct; }
    const html = `<button class="toggle" data-act="toggle" aria-expanded="${panelOpen}">${panelOpen ? "ย่อ ▴" : "รายละเอียด ▾"}</button>` + panelBody(level);
    if (html !== lastPanel) { lastPanel = html; panelEl.innerHTML = html; }
    panelEl.classList.toggle("collapsed", !panelOpen);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
